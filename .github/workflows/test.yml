name: test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/debug.yml'
      - '!.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: ${{ matrix.os }} (Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ['1.27.1']
        include:
          - os: windows-latest
            go: '1.27.1'
          - os: macos-latest
            go: '1.27.1'
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Install network test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2
      - name: Test
        shell: bash
        env:
          TEST_FLAGS: ${{ runner.os != 'Windows' && '-exec sudo' || '' }}
        run: |
          go build -v .
          # 这三个依赖干净 netns + 精确内核时序，在共享 runner 上会挂起或 i/o timeout，
          # 上游原始提交下同样不稳定；本地直接跑 `go test .` 仍会执行它们。
          skip='TestGoConnKeepalive|TestGoKernelZeroWindowHalfClose|TestGoKernelFlowControl'
          if [ "$RUNNER_OS" != "Linux" ]; then
            # 内核栈整合测试要真实 TUN 设备与内核时序，共享 macOS/Windows runner 上只会超时。
            # 这层覆盖由 ubuntu job 负责；非 Linux 仍跑 memory stack 全套、其余单元测试与 ping。
            skip="$skip|TestGoKernel|TestGoConn"
          fi
          pkgs=$(go list ./...)
          if [ "$RUNNER_OS" = "Windows" ]; then
            # winipcfg 的测试全要真实网络接口与路由表，共享 runner 上只会 "Element not found"。
            pkgs=$(printf '%s\n' "$pkgs" | grep -v '/internal/winipcfg' || true)
          fi
          # shellcheck disable=SC2086
          # TEST_FLAGS 与 pkgs 必须按词拆成多个 go test 参数，不能整体加引号。
          go test -v $TEST_FLAGS -skip "$skip" $pkgs
      - name: Test unprivileged ping
        if: runner.os != 'Linux'
        run: go test -v ./ping
      - name: Test privileged ping
        if: runner.os != 'Windows'
        run: |
          go test -c -o ping_test ./ping
          sudo ./ping_test -test.v
