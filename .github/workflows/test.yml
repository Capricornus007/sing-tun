name: test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/debug.yml'
      - '!.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: ${{ matrix.os }} (Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ['1.27.1']
        include:
          - os: windows-latest
            go: '1.27.1'
          - os: macos-latest
            go: '1.27.1'
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Install network test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2
      - name: Test
        shell: bash
        env:
          TEST_FLAGS: ${{ runner.os != 'Windows' && '-exec sudo' || '' }}
          # 排除三个依赖干净 netns + 精确内核时序的整合测试：它们在上游原始提交下同样不稳定，
          # 在共享 runner 上会挂起或 i/o timeout；本地直接跑 `go test .` 仍会执行它们。
          SKIP_TESTS: TestGoConnKeepalive|TestGoKernelZeroWindowHalfClose|TestGoKernelFlowControl
        run: |
          go build -v .
          pkgs=$(go list ./...)
          if [ "$RUNNER_OS" = "Windows" ]; then
            # winipcfg 的测试全要真实网络接口与路由表，共享 runner 上只会 "Element not found"。
            pkgs=$(printf '%s\n' "$pkgs" | grep -v '/internal/winipcfg' || true)
          fi
          # shellcheck disable=SC2086
          # TEST_FLAGS 与 pkgs 必须按词拆成多个 go test 参数，不能整体加引号。
          go test -v $TEST_FLAGS -skip "$SKIP_TESTS" $pkgs
      - name: Test unprivileged ping
        if: runner.os != 'Linux'
        run: go test -v ./ping
      - name: Test privileged ping
        if: runner.os != 'Windows'
        run: |
          go test -c -o ping_test ./ping
          sudo ./ping_test -test.v
